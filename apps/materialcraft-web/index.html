<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>The AllCraft Material</title>
  <link data-trunk rel="rust" data-bin="materialcraft-web" data-cargo-profile="wasm-release" data-wasm-opt="0" data-weak-refs />
  <!-- The SBS library's bitmaps ship beside the wasm -->
  <link data-trunk rel="copy-dir" href="../../assets/sbs/resources" data-target-path="sbs/resources" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: #1c1c1f; }
    #materialcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none;
      touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    #materialcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #c9c9ce; font: 14px system-ui, sans-serif; pointer-events: none; background: #1c1c1f; }
  </style>
</head>
<body>
  <canvas id="materialcraft_canvas"></canvas>
  <div id="materialcraft_loading" role="status" aria-live="polite">
    <div style="margin-bottom:12px;font-size:15px;font-weight:600;color:#ececef">Loading The AllCraft Material&hellip;</div>
    <div style="width:240px;height:5px;background:#323238;border-radius:999px;overflow:hidden">
      <div id="mc_load_bar" style="width:2%;height:100%;background:#e879f9;border-radius:999px;transition:width 0.12s ease-out"></div>
    </div>
    <div id="mc_load_pct" style="margin-top:8px;font-size:12px;color:#9ca3af;font-variant-numeric:tabular-nums">Starting&hellip;</div>
    <progress id="materialcraft_progress" max="1" hidden></progress>
    <p id="materialcraft_status" hidden></p>
  </div>
</body>
</html>
